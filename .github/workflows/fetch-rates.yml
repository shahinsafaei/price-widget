name: Fetch Rates

on:
  schedule:
    # Every 15 minutes, 05:00-16:59 UTC (= 08:30-20:29 Tehran, UTC+3:30)
    - cron: '0,15,30,45 5-16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check Tehran market hours
        id: hours
        run: |
          hour=$(TZ='Asia/Tehran' date +%H)
          hour=$((10#$hour))
          echo "Current Tehran hour: $hour"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$hour" -ge 9 ] && [ "$hour" -lt 20 ]; }; then
            echo "within=true" >> "$GITHUB_OUTPUT"
          else
            echo "within=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest rates
        if: steps.hours.outputs.within == 'true'
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          if [ -z "$BRSAPI_KEY" ]; then
            echo "::error::Secret BRSAPI_KEY is empty. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p data
          ok=0
          for base in \
            "https://brsapi.ir/Api/Market/Gold_Currency.php" \
            "https://api.brsapi.ir/Market/Gold_Currency.php"; do
            echo "Trying: $base"
            code=$(curl -sS -L --max-time 30 \
              -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" \
              -H "Accept: application/json" \
              -w '%{http_code}' -o /tmp/rates.json \
              "${base}?key=${BRSAPI_KEY}" || true)
            echo "HTTP status: $code"
            head -c 300 /tmp/rates.json; echo
            if [ "$code" = "200" ] && jq -e '(.gold|type=="array") and (.currency|type=="array") and (.cryptocurrency|type=="array")' /tmp/rates.json > /dev/null 2>&1; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::No valid response from brsapi (bad key, wrong URL, or the API blocks GitHub's foreign IPs). Old data/latest.json is kept."
            exit 1
          fi
          # Write to a temp file first, then move into place so a crash can't leave a truncated file.
          tmp_out=$(mktemp)
          if ! jq -c . /tmp/rates.json > "$tmp_out"; then
            echo "::error::jq failed to compact the fetched JSON. Keeping old data/latest.json."
            rm -f "$tmp_out"
            exit 1
          fi
          if [ ! -s "$tmp_out" ]; then
            echo "::error::jq produced an empty output. Keeping old data/latest.json."
            rm -f "$tmp_out"
            exit 1
          fi
          mv "$tmp_out" data/latest.json

      - name: Commit and push if changed
        if: steps.hours.outputs.within == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update rates $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi